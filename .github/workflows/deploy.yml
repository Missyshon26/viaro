name: Deploy backend

# Push to main -> test -> build -> upload to the server -> restart -> health check.
# The server never reaches out to GitHub: CI builds, then pushes the finished build over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # Not secret: where to deploy. Only the private key is a repository secret.
  DEPLOY_HOST: ec2-54-213-12-58.us-west-2.compute.amazonaws.com
  DEPLOY_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      - name: Package release
        run: |
          mkdir -p release
          cp -r dist package.json package-lock.json release/
          tar -czf release.tgz -C release .

      - name: Install SSH key
        env:
          # Preferred: the key as ONE base64 line (cannot be damaged by copy and paste).
          KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          # Fallback: the raw multi-line key.
          KEY_RAW: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KEY_B64" ]; then
            printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy_key
          elif [ -n "$KEY_RAW" ]; then
            printf '%s\n' "$KEY_RAW" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "No SSH key: add the repository secret DEPLOY_SSH_KEY_B64 (or DEPLOY_SSH_KEY)"; exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || { echo "The stored SSH key is not a valid private key"; exit 1; }
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and switch release
        env:
          TARGET: ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}
          RELEASE: ${{ github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes release.tgz "$TARGET:/tmp/abl-$RELEASE.tgz"
          $SSH "$TARGET" "bash -s" -- "$RELEASE" < scripts/deploy/remote-deploy.sh
